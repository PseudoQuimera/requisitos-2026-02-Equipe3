<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPCID — Protótipo navegável</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#E4F2FE;--sf:#fff;--tx:#132190;--mu:#4a58a8;--bd:#b9d4fb;--ac:#004AF7;--ac2:#E4F2FE;--wn:#132190;--wb:#cfe3ff;--ok:#0f7a4a;--er:#c0262d;--hd:#004AF7;--hd2:#132190;--y:#87B7FE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme=light]){--bg:#0f1521;--sf:#182133;--tx:#e8edf6;--mu:#98a3b8;--bd:#2c3850;--ac:#7aa8f0;--ac2:#1f2d49;--wn:#f0c36a;--wb:#3a2d12;--ok:#6fd096;--er:#f0868a}}
:root[data-theme=off]{--bg:#0f1521;--sf:#182133;--tx:#e8edf6;--mu:#98a3b8;--bd:#2c3850;--ac:#7aa8f0;--ac2:#1f2d49;--wn:#f0c36a;--wb:#3a2d12;--ok:#6fd096;--er:#f0868a}
html{color-scheme:light}*{box-sizing:border-box}
body.out .lay,body.out .aviso,body.out #who,body.out #out{display:none}body:not(.out) #lg{display:none}#who{font-size:14px}
.lgw{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 100px);--bg:#E4F2FE;--sf:#fff;--tx:#132190;--mu:#4a58a8;--bd:#b9d4fb;--ac:#004AF7;--ac2:#E4F2FE;--wn:#132190;--wb:#cfe3ff;--er:#c0262d;background:var(--bg);color:var(--tx)}
.lp{background:var(--hd);color:#E4F2FE;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;font-size:44px;line-height:1.1;font-weight:500}.lp em{font-weight:700}.lp small{font-size:14px;margin-top:24px;font-weight:400;line-height:1.5}
.lr{padding:40px;display:flex;flex-direction:column;justify-content:center;max-width:560px}.lr label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;margin-bottom:10px}.err{color:var(--er);min-height:22px;font-size:13px}
@media(max-width:760px){.lgw{grid-template-columns:1fr}.lp{padding:28px;font-size:30px}.lr{padding:24px}}
body{margin:0;font:15px/1.55 "Satoshi","DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;border-bottom:0;padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:20px;font-weight:700;display:block;line-height:1.1}header small{display:block;font-size:12px;color:#E4F2FE}header label{color:#E4F2FE;font-size:13px}.wm{font-weight:700;font-size:19px;line-height:1.05}.sep{width:1px;height:36px;background:#87B7FE}header select{color:#132190;background:#E4F2FE;border-color:#E4F2FE}header::after{content:"";width:92px;height:32px;margin-left:4px;background:radial-gradient(circle at 16px 16px,#87B7FE 15px,#0000 16px),radial-gradient(circle at 46px 16px,#E4F2FE 15px,#0000 16px),radial-gradient(circle at 76px 16px,#87B7FE 15px,#0000 16px)}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer;background:var(--hd);color:#fff;border-color:var(--hd);border-radius:999px;font-weight:700;padding:8px 18px}button.g{background:var(--sf);color:var(--tx);border-color:var(--bd)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.aviso{background:var(--wb);color:var(--wn);padding:8px 16px;font-size:13px;border-bottom:1px solid var(--bd)}
.lay{display:flex;min-height:calc(100vh - 100px)}
nav{width:270px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px 12px}
nav button{display:block;width:100%;text-align:left;background:none;color:var(--tx);border:0;border-radius:12px;padding:10px 14px;margin-bottom:2px;font-weight:500}
nav button.on{background:var(--hd);color:#fff;font-weight:700}
main{flex:1;padding:20px;min-width:0;max-width:980px}
h2{margin:0 0 4px;font-size:28px;font-weight:500;letter-spacing:-.5px;color:var(--ac)}.sub{color:var(--mu);margin:0 0 16px;font-size:13px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;background:var(--ac2);color:var(--ac)}.tag.w{background:var(--wb);color:var(--wn)}.tag.o{background:var(--ac2);color:var(--ok)}.tag.e{color:var(--er)}
.empty{color:var(--mu);padding:14px;text-align:center}.bar{height:10px;background:var(--c,var(--ac));border-radius:5px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.kp .box{margin:0;border-top:6px solid var(--c,var(--ac))}.kp strong{font-size:26px;display:block}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:760px){.lay{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav button{white-space:nowrap;width:auto;margin-right:4px}}
</style></head><body>
<header><span class="wm">Universidade<br>de Fortaleza</span><span class="sep"></span><span><b>GPCID</b><small>Produção científica e internacionalização docente · DRI</small></span>
<span style="flex:1"></span><span id="who"></span><button class="g" id="out" onclick="logout()">Sair</button></header>
<div class="aviso">Protótipo com dados de exemplo e sem integrações reais. Perfis e associações ator × caso de uso são propostas do SRS 0.3, ainda não aprovadas pela DRI.</div>
<div class="lay"><nav id="nv" aria-label="Casos de uso"></nav><main id="mn"></main></div><div id="lg"></div><div id="toast" role="status"></div>
<script>
const A={1:'AT-01 Docente',2:'AT-02 Gestor de internacionalização',3:'AT-03 Analista de internacionalização',4:'AT-04 Responsável pela pesquisa científica',5:'AT-05 Administrador do sistema',6:'AT-06 Gestor acadêmico'};
const M=[[1,'CDU-01 Currículo e formação',[1,2,4,6]],[3,'CDU-03 Publicações',[1,2,4]],[4,'CDU-04 Classificar internacionalização',[2,3,4]],[6,'CDU-06 Colaborações',[1,2,3,4]],[7,'CDU-07 Missões internacionais',[1,2,3]],[10,'CDU-10 Indicadores',[2,3,4,6]],[11,'CDU-11 Relatórios',[2,3,4,6]],[12,'CDU-12 Configurar indicadores',[2]],[13,'CDU-13 Versionar indicadores',[2]],[14,'CDU-14 Divergências',[2,3,4,5]],[15,'CDU-15 Origem e histórico',[2,3,5]],[16,'CDU-16 Integrações',[5]],[17,'CDU-17 Usuários e permissões',[5]]];
const D=[{id:1,n:'Ana Beatriz Lima',c:'Direito',t:'Doutora',f:[['Doutorado','Universidade de Coimbra','Portugal'],['Mestrado','UFC','Brasil']]},{id:2,n:'Carlos Mendes',c:'Engenharia',t:'Doutor',f:[['Doutorado','TU München','Alemanha']]},{id:3,n:'Beatriz Souza',c:'Psicologia',t:'Mestra',f:[['Mestrado','USP','Brasil']]},{id:4,n:'Rafael Ponte',c:'Medicina',t:'Doutor',f:[]}];
const P=[{id:1,t:'Direito digital e proteção de dados',d:1,tp:'Artigo',a:2024,v:'European Data Law Review',ex:1,co:1,cl:'Pendente'},{id:2,t:'Fundamentos do processo coletivo',d:1,tp:'Livro',a:2022,v:'Editora Forense',ex:0,co:0,cl:'Pendente'},{id:3,t:'Otimização de redes elétricas',d:2,tp:'Artigo',a:2024,v:'IEEE Transactions on Power Systems',ex:1,co:1,cl:'Internacional'},{id:4,t:'Estruturas em concreto reforçado',d:2,tp:'Capítulo',a:2023,v:'Springer',ex:1,co:0,cl:'Pendente'},{id:5,t:'Ansiedade em estudantes universitários',d:3,tp:'Artigo',a:2023,v:'Revista Psicologia em Foco',ex:0,co:0,cl:'Nacional'},{id:6,t:'Telemedicina no Nordeste',d:4,tp:'Trabalho em evento',a:2025,v:null,ex:0,co:0,cl:'Pendente'},{id:7,t:'Direito digital e proteção de dados',d:1,tp:'Trabalho em evento',a:2024,v:'Congresso LGPD',ex:0,co:0,cl:'Nacional'}];
const C=[[1,'Univ. de Coimbra','Portugal','2022–2024','P1'],[2,'TU München','Alemanha','2023–2025','P3'],[2,'Univ. de São Paulo','Brasil','2024','P4'],[3,'UFC','Brasil','2023','P5']];
let MS=[{d:2,dest:'TU München',p:'Alemanha',per:'03/2025',fin:'Pesquisa colaborativa'}];
let CF=[{n:'Artigos em periódicos estrangeiros',m:'Quantidade de artigos distintos',g:'Ano'}];
let VR=[{v:1,dt:'01/11/2026',r:'Grupo 3',j:'Definição inicial',d:'Contagem de artigos em periódicos com sede no exterior'}];
let DV=[{id:1,tp:'Duplicada',rg:'Pub. 1 e 7 — mesmo título (Direito digital…)',st:'Aberta',nt:''},{id:2,tp:'Incompleta',rg:'Pub. 6 — periódico/editora ausente',st:'Aberta',nt:''},{id:3,tp:'Incompleta',rg:'Docente Rafael Ponte — sem formação',st:'Em análise',nt:'Aguardando currículo'}];
let US=[['Ana Beatriz Lima','AT-01','N1',1],['Carlos Mendes','AT-01','N1',1],['Marcelo Ponte','AT-02','N4',1],['Julia Pires','AT-03','N3',1],['Lucas Reis','AT-05','N5',1]];
let LG=[],cur=0,scr=1,sd=1,fl={};
const CR=[['docente','doc123',1],['gestor.dri','dri123',2],['analista.dri','ana123',3],['pesquisa','pes123',4],['admin','adm123',5],['gestor.acad','aca123',6]];
function showLogin(){document.body.classList.add('out');$('#lg').innerHTML=`<div class="lgw"><div class="lp"><span>Para aprender<br>é preciso<br><em>curiosidade</em></span><small>GPCID · protótipo com dados de exemplo</small></div><div class="lr"><h2>Entrar</h2><p class="sub">Use seu login e senha para acessar o sistema.</p><label>Login<input id="lu" autocomplete="off" onkeydown="if(event.key=='Enter')login()"></label><label>Senha<input id="lp" type="password" autocomplete="off" onkeydown="if(event.key=='Enter')login()"></label><div class="err" id="le" role="alert"></div><div><button onclick="login()">Entrar</button></div><div class="box" style="margin-top:22px"><b>Acessos de teste</b><p class="sub" style="margin:2px 0 8px">Credenciais fictícias. A autenticação institucional ainda está pendente (P-09).</p>${tb(['Perfil','Login','Senha',''],CR.map((c,i)=>[A[c[2]],c[0],c[1],`<button class="g" onclick="fillL(${i})">Carregar</button>`]))}</div></div></div>`}
function fillL(i){$('#lu').value=CR[i][0];$('#lp').value=CR[i][1];$('#le').textContent='';$('#lp').focus()}
function login(){const u=$('#lu').value.trim(),p=$('#lp').value,c=CR.find(x=>x[0]==u&&x[1]==p);if(!c){$('#le').textContent='Login ou senha incorretos. Confira os dados ou carregue um acesso de teste.';return}cur=c[2];fl={};toast('Bem-vindo(a), '+A[cur].slice(6));go()}
function logout(){cur=0;showLogin()}
const $=s=>document.querySelector(s),y=new Date().toLocaleDateString('pt-BR');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const dn=i=>D.find(d=>d.id==i).n,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=()=>cur==1?D.filter(d=>d.id==1):D,ps=()=>cur==1?P.filter(p=>p.d==1):P;
const opt=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
const tb=(h,r,e='Nenhum registro encontrado.')=>r.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div class="empty">${e}</div>`;
const hd=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
function go(){if(!cur)return showLogin();document.body.classList.remove('out');$('#who').textContent=A[cur];
const al=M.filter(m=>m[2].includes(cur));if(!al.find(m=>m[0]==scr))scr=al[0][0];
$('#nv').innerHTML=al.map(m=>`<button class="${m[0]==scr?'on':''}" onclick="scr=${m[0]};go()">${m[1]}</button>`).join('');
$('#mn').innerHTML=S[scr]();}
const S={};
S[1]=()=>{const l=ds();if(!l.find(d=>d.id==sd))sd=l[0].id;const d=D.find(x=>x.id==sd);
return hd('Currículo, formação e titulação','Consolida RF-01 e RF-02. '+(cur==1?'Você vê apenas os seus dados.':'Dados curriculares autorizados.'))+
`<div class="row"><label>Docente<select onchange="sd=+this.value;go()">${l.map(x=>`<option value="${x.id}" ${x.id==sd?'selected':''}>${x.n}</option>`).join('')}</select></label></div>
<div class="box"><b>${d.n}</b> <span class="tag">${d.t}</span><br><span style="color:var(--mu)">${d.c}</span></div>
<div class="box"><b>Formação acadêmica</b>${tb(['Nível','Instituição','País'],d.f,'Formação indisponível na fonte. Nenhum dado foi preenchido.')}</div>`};
S[3]=()=>{const l=ps().filter(p=>(!fl.d||p.d==fl.d)&&(!fl.tp||p.tp==fl.tp)&&(!fl.a||p.a==fl.a));
return hd('Publicações científicas','RF-03. Filtros de exemplo: docente, tipo e ano.')+
`<div class="row">${cur!=1?`<label>Docente<select onchange="fl.d=+this.value;go()"><option value="">Todos</option>${D.map(d=>`<option value="${d.id}" ${fl.d==d.id?'selected':''}>${d.n}</option>`).join('')}</select></label>`:''}
<label>Tipo<select onchange="fl.tp=this.value;go()"><option value="">Todos</option>${opt(['Artigo','Livro','Capítulo','Trabalho em evento'],fl.tp)}</select></label>
<label>Ano<select onchange="fl.a=this.value;go()"><option value="">Todos</option>${opt([2022,2023,2024,2025],fl.a)}</select></label>
<button class="g" onclick="fl={};go()">Limpar filtros</button></div>`+
`<div class="box">${tb(['Título','Docente','Tipo','Ano','Periódico/editora'],l.map(p=>[p.t,dn(p.d),p.tp,p.a,p.v||'<span class="tag w">ausente</span>']),'Nenhuma publicação corresponde aos filtros.')}</div>`};
S[4]=()=>`${hd('Classificar internacionalização','RF-04. Critérios institucionais pendentes (P-01): a regra abaixo é só ilustrativa e o idioma isolado não classifica.')}
<div class="box">${tb(['Publicação','Periódico/editora estrangeiro','Coautor estrangeiro','Classificação',''],P.map(p=>[p.t+' <small>('+p.a+')</small>',p.v?(p.ex?'Sim':'Não'):'—',p.co?'Sim':'Não',`<select aria-label="Classificação" onchange="P[${p.id-1}].cl=this.value;toast('Classificação registrada')">${opt(['Internacional','Nacional','Pendente'],p.cl)}</select>`,`<button class="g" onclick="rg(${p.id-1})">Sugerir pela regra</button>`]))}</div>`;
function rg(i){const p=P[i];p.cl=!p.v?'Pendente':(p.ex||p.co)?'Internacional':'Nacional';toast(p.v?'Sugestão aplicada: '+p.cl:'Dados insuficientes: mantido como Pendente');go()}
S[6]=()=>{const l=C.filter(c=>cur!=1||c[0]==1);return hd('Colaborações científicas','RF-06.')+`<div class="box">${tb(['Docente','Instituição','País','Período','Produção'],l.map(c=>[dn(c[0]),c[1],c[2],c[3],c[4]]),'Nenhuma colaboração registrada.')}</div>`};
S[7]=()=>{const l=MS.filter(m=>cur!=1||m.d==1);return hd('Missões internacionais','RF-07. Campos e responsável pelo cadastro ainda pendentes (P-02); os campos abaixo são provisórios.')+
`<div class="box"><div class="row"><label>Docente<select id="m0">${ds().map(d=>`<option value="${d.id}">${d.n}</option>`).join('')}</select></label><label>Destino*<input id="m1"></label><label>País*<input id="m2"></label><label>Período*<input id="m3" placeholder="MM/AAAA"></label><label>Finalidade<input id="m4"></label><button onclick="am()">Registrar missão</button></div>
${tb(['Docente','Destino','País','Período','Finalidade'],l.map(m=>[dn(m.d),m.dest,m.p,m.per,m.fin||'—']),'Nenhuma missão registrada.')}</div>`};
function am(){const v=[0,1,2,3,4].map(i=>$('#m'+i).value.trim());if(!v[1]||!v[2]||!v[3])return toast('Preencha destino, país e período.');MS.push({d:+v[0],dest:v[1],p:v[2],per:v[3],fin:v[4]});toast('Missão registrada');go()}
S[10]=()=>{const a=fl.ia||'',pb=P.filter(p=>!a||p.a==a);const q=[['IND-01 Docentes com formação no exterior',D.filter(d=>d.f.some(f=>f[2]!='Brasil')).length,D.length],['IND-02 Artigos em periódicos estrangeiros',pb.filter(p=>p.tp=='Artigo'&&p.ex).length,pb.filter(p=>p.tp=='Artigo').length],['IND-05 Produções distintas no período',pb.length,P.length],['IND-06 Missões internacionais',MS.length,MS.length||1],['IND-07 Colaborações internacionais',C.filter(c=>c[2]!='Brasil').length,C.length],['IND-09 Docentes com formação completa',D.filter(d=>d.f.length).length,D.length]];
return hd('Indicadores','RF-10. Fórmulas sujeitas a homologação (P-03). IND-08 em reavaliação e por isso não exibido.')+`<div class="row"><label>Ano de referência<select onchange="fl.ia=this.value;go()"><option value="">Todos (2022–2025)</option>${opt([2022,2023,2024,2025],a)}</select></label></div>
<div class="kp">${q.map(k=>`<div class="box" style="--c:${['#004AF7','#87B7FE','#004AF7','#87B7FE','#004AF7','#87B7FE'][q.indexOf(k)]}"><span style="color:var(--mu);font-size:13px">${k[0]}</span><strong>${k[1]}</strong><div class="bar" style="width:${k[2]?Math.round(100*k[1]/k[2]):0}%"></div><small style="color:var(--mu)">de ${k[2]} · período: ${a||'todos'} · versão ${VR.length?'v'+VR[VR.length-1].v:'—'}</small></div>`).join('')}</div>`};
S[11]=()=>{const l=P.filter(p=>!fl.rt||p.tp==fl.rt);return hd('Relatórios','RF-11. Painel da DRI: visão de indicadores internacionais. Exportação simulada.')+
`<div class="box"><div class="row"><label>Tipo de produção<select onchange="fl.rt=this.value;go()"><option value="">Todas</option>${opt(['Artigo','Livro','Capítulo','Trabalho em evento'],fl.rt)}</select></label>
<button onclick="toast('Exportação simulada: arquivo CSV com '+${l.length}+' linhas')">Exportar CSV</button></div>
${tb(['Docente','Título','Tipo','Ano','Classificação'],l.map(p=>[dn(p.d),p.t,p.tp,p.a,p.cl]),'Nenhum dado para os filtros selecionados.')}</div>`};
S[12]=()=>hd('Configurar indicadores','RF-12. Elementos permitidos vêm de uma lista; não há edição livre de comandos.')+
`<div class="box"><div class="row"><label>Nome*<input id="c0"></label><label>Medida*<select id="c1"><option value="">Selecione</option>${opt(['Quantidade de artigos distintos','Quantidade de docentes distintos','Quantidade de missões','Percentual de registros completos'])}</select></label><label>Agrupamento<select id="c2">${opt(['Ano','Docente','Curso','País'])}</select></label><button onclick="sc()">Salvar configuração</button></div>
${tb(['Nome','Medida','Agrupamento'],CF.map(c=>[c.n,c.m,c.g]))}</div>`;
function sc(){const n=$('#c0').value.trim(),m=$('#c1').value;if(!n||!m)return toast('Informe o nome e a medida do indicador.');CF.push({n,m,g:$('#c2').value});LG.unshift(y+' · configuração de indicador “'+n+'”');toast('Configuração salva');go()}
S[13]=()=>hd('Versionar indicadores','RF-13. Cada alteração preserva a versão anterior.')+
`<div class="box"><div class="row"><label>Nova definição*<input id="v0" size="40"></label><label>Justificativa*<input id="v1" size="26"></label><button onclick="nv()">Criar versão</button></div>
${tb(['Versão','Data','Responsável','Justificativa','Definição'],VR.slice().reverse().map(v=>['v'+v.v,v.dt,v.r,v.j,esc(v.d)+(v.v>1?'<br><small style="color:var(--mu)">Anterior: '+esc(VR[v.v-2].d)+'</small>':'')]))}</div>`;
function nv(){const d=$('#v0').value.trim(),j=$('#v1').value.trim();if(!d||!j)return toast('Informe a definição e a justificativa.');VR.push({v:VR.length+1,dt:y,r:A[cur].slice(6),j,d});toast('Versão v'+VR.length+' criada; v'+(VR.length-1)+' preservada');go()}
S[14]=()=>hd('Divergências','RF-14. '+(cur==5?'Como administrador, você apoia o lado técnico; a análise de conteúdo cabe a outros perfis (a detalhar).':'Registre a análise de cada ocorrência.'))+
