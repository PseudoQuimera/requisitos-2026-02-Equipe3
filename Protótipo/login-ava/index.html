<meta content="noindex, nofollow" name="robots"/>

<meta content="#004af7" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="black" name="apple-mobile-web-app-status-bar-style"/>

<meta content="yes" name="apple-touch-fullscreen"/>

<link href="css/styles.css" rel="stylesheet"/>
<link href="css/bootstrap.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>

<script defer="" src="js/form-controls.js"></script>
<link href="css/proto.css" rel="stylesheet"/></head>
<body class="unifor-theme login-page">
<main class="fxt-template-animation dtec-layout loaded">
<div class="fxt-content-wrap">
<div class="fxt-heading-content">
<div class="fxt-inner-wrap">
<div class="fxt-transformX-R-50 fxt-transition-delay-10">
<a class="fxt-logo" href="#">
<img alt="Universidade de Fortaleza" src="img/unifor-h-negativa.svg"/>
</a>
</div>
<div class="fxt-transformX-R-50 fxt-transition-delay-10">
<div class="fxt-middle-content">
</div>
</div>
<div class="fxt-transformX-R-50 fxt-transition-delay-10">
<div class="d-flex align-items-center flex-wrap justify-content-between footer">
<ul class="fxt-socials">
<li class="fxt-facebook fxt-transformY-50 fxt-transition-delay-9">
<a aria-label="Facebook" href="#"><i aria-hidden="true" class="fa-brands fa-facebook-f"></i></a>
</li>
<li class="fxt-instagram fxt-transformY-50 fxt-transition-delay-9">
<a aria-label="Instagram" href="#"><i aria-hidden="true" class="fab fa-instagram"></i></a>
</li>
<li class="fxt-youtube fxt-transformY-50 fxt-transition-delay-9">
<a aria-label="YouTube" href="#"><i aria-hidden="true" class="fab fa-youtube"></i></a>
</li>
<li class="fxt-tiktok fxt-transformY-50 fxt-transition-delay-9">
<a aria-label="TikTok" href="#"><i aria-hidden="true" class="fab fa-tiktok"></i></a>
</li>
<li class="fxt-twitter fxt-transformY-50 fxt-transition-delay-10">
<a aria-label="X" href="#"><i aria-hidden="true" class="fa-brands fa-x-twitter"></i></a>
</li>
<li class="fxt-linkedin fxt-transformY-50 fxt-transition-delay-12">
<a aria-label="LinkedIn" href="#"><i aria-hidden="true" class="fab fa-linkedin-in"></i></a>
</li>
<li class="fxt-flickr fxt-transformY-50 fxt-transition-delay-13">
<a aria-label="Flickr" href="#"><i aria-hidden="true" class="fa-brands fa-flickr"></i></a>
</li>
</ul>
<div class="fxt-copyright-text">Fundação Edson Queiroz | Universidade de Fortaleza</div>
</div>
</div>
</div>
</div>
<div class="fxt-form-content">
<div class="fxt-main-form">
<div class="fxt-inner-wrap fxt-opacity fxt-transition-delay-13">
<div>
<div class="mb-3 logo-simbolo">
<img alt="Universidade de Fortaleza" src="img/logo-unifor-message.svg"/>
</div>
<form action="#" novalidate="">
<div class="fxt-form-step">
<div class="page-title-container">
<h1 class="page-title">Acesse sua conta Unifor</h1>
<div class="page-subtitle">Entre e utilize nossos serviços digitais em um só lugar</div>
</div>
<div class="form-group mt-3">
<label class="form-label" for="username">Matrícula</label>
<input aria-invalid="false" autocomplete="username" class="form-control" id="username" name="username" placeholder="Número da matrícula" required="" type="text" value=""/>
</div>
<div class="form-group">
<label class="form-label" for="password">Senha</label>
<div class="input-container">
<input aria-describedby="login-password-hint" aria-invalid="false" autocomplete="current-password" class="form-control" id="password" name="password" placeholder="Senha" required="" type="password" value=""/>
<button aria-controls="password" aria-label="Exibir senha" aria-pressed="false" class="toggle-password" data-label-hide="Ocultar senha" data-label-show="Exibir senha" data-password-toggle-target="password" type="button">
<i aria-hidden="true" class="fa-solid fa-eye" id="togglePasswordIcon"></i>
</button>
</div>
<p class="hint-text" id="login-password-hint">Use os 8 números da sua senha.</p>
</div>
<div class="form-group">
<div class="radio-wrap">
<div class="login-options">
<a class="esqueci-senha" href="#">
                    Esqueci minha senha
                  </a>
</div>
</div>
</div>
<div class="form-group">
<div id="login-error" role="alert"></div><div class="d-flex align-items-center gap-2 mt-5">
<button class="dtec-btn fxt-btn-fill w-100" id="loginbtn" name="acessar" type="submit">
                Acessar
              </button>
</div>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</main>
<script src="js/jquery-3.5.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/imagesloaded.pkgd.min.js"></script>
<script src="js/main.js"></script>
<script src="js/proto-login.js"></script></body></html>
